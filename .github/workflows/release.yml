name: Release

# Runs when the version in package.json changes on main (or by hand from the
# Actions tab). Skips if that version is already published; a draft gets
# filled in and published.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if this version is new
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "v$v is already released, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.version.outputs.new == 'true'
      - run: npx electron-builder --win nsis --x64 --publish always
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest
